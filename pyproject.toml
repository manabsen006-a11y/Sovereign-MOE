[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovopt"
version = "0.1.0"
description = "Sovereign GPU-accelerated LP/MILP/QP optimization engine (SIH 2026 PS 26119, MRPL)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "numba>=0.59"]

[project.optional-dependencies]
# [ctk] brings the CUDA runtime, NVRTC and the BLAS/sparse libraries in as
# nvidia-*-cu12 wheels, so the GPU path needs an NVIDIA driver and nothing
# else -- no system CUDA Toolkit, no CUDA_PATH. Without it, cupy imports on a
# machine that has the toolkit and fails to load on one that does not, and
# a fresh clone's suite then skips the GPU tests; with it, the tests run
gpu = ["cupy-cuda12x[ctk]"]
ui = ["fastapi>=0.100", "uvicorn>=0.20"]
# reading an Aspen PIMS workbook directly (sovopt pims model.xlsx); a folder
# of the tables saved as CSV needs nothing
pims = ["openpyxl>=3"]
# httpx2 is what starlette's TestClient drives (1.6 deprecated httpx there);
# without it and the ui extra, tests/test_ui.py skips rather than fails --
# which is how a fresh clone was found to have never exercised the UI.
# openpyxl is here so the PIMS workbook test runs rather than being absent
dev = ["pytest>=7", "scipy>=1.10", "httpx2>=2", "openpyxl>=3"]

[project.scripts]
sovopt = "sovopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
