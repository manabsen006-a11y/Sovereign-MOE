[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovopt"
version = "0.1.0"
description = "Sovereign GPU-accelerated LP/MILP/QP optimization engine (SIH 2026 PS 26119, MRPL)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "numba>=0.59"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
dev = ["pytest>=7", "scipy>=1.10"]

[project.scripts]
sovopt = "sovopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
